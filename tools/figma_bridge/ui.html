<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 12px/1.4 Inter, sans-serif; margin: 12px; color: #2b2118; background: #f3ead3; }
      h1 { font-size: 14px; margin: 0 0 6px; }
      #status { padding: 4px 6px; border: 1px solid #2b2118; border-radius: 3px; margin-bottom: 8px; }
      button { font: inherit; padding: 4px 8px; border: 2px solid #2b2118; border-radius: 3px; background: #d9772b; cursor: pointer; }
      textarea { width: 100%; height: 54px; box-sizing: border-box; font: 11px monospace; margin-top: 6px; }
      .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
      .hint { color: #6e4a2d; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>ScanDig Bridge</h1>
    <div id="status">a ligar a 127.0.0.1:8765…</div>
    <div class="row">
      <button id="build">Criar kit</button>
      <span id="last">—</span>
    </div>
    <textarea id="cmd" placeholder='Comando manual: {"type":"ping"}'></textarea>
    <div class="row"><button id="send">Executar comando</button></div>
    <div class="hint">O terminal enfileira com <code>python tools/figma_agent.py …</code>. Sem servidor, usa o botão acima.</div>
    <script>
      const BASE = "http://127.0.0.1:8765";
      const status = document.getElementById("status");
      const last = document.getElementById("last");

      function setStatus(text, ok) {
        status.textContent = text;
        status.style.background = ok ? "#d9e8d2" : "#f3d6cc";
      }

      async function post(path, payload) {
        await fetch(BASE + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
      }

      window.onmessage = (event) => {
        const message = event.data && event.data.pluginMessage;
        if (!message || message.type !== "result") return;
        last.textContent = message.ok ? (message.kind === "export" ? "PNG " + message.name : message.text || "ok") : "erro";
        post("/result", message).catch(() => setStatus("resultado não enviado", false));
      };

      function send(command) {
        parent.postMessage({ pluginMessage: command }, "*");
      }

      async function poll() {
        try {
          const response = await fetch(BASE + "/next", { cache: "no-store" });
          const command = await response.json();
          setStatus("ligado · à espera de comandos", true);
          if (command && command.type && command.type !== "idle") {
            setStatus("a executar: " + command.type, true);
            send(command);
          }
        } catch (error) {
          setStatus("sem servidor — corre figma_agent.py serve", false);
        }
        setTimeout(poll, 1500);
      }

      document.getElementById("build").onclick = () => send({ type: "build" });
      document.getElementById("send").onclick = () => {
        try {
          const command = JSON.parse(document.getElementById("cmd").value);
          send(command);
        } catch (error) {
          last.textContent = "JSON inválido";
        }
      };

      parent.postMessage({ pluginMessage: { type: "ui-ready" } }, "*");
      poll();
    </script>
  </body>
</html>
