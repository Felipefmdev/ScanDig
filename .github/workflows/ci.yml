name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      # --import espera o import de todos os assets (.glb, fontes) e o cache de class_name.
      # O antigo --editor --quit saía no 1º frame, antes disso, e as instâncias de .glb sumiam.
      - name: Import project (assets + class_name cache)
        run: ./godot --headless --path . --import

      - name: Parse-check every scene by loading it
        run: |
          for scene in world/map_praia.tscn world/test_sandbox.tscn; do
            ./godot --headless --path . --quit-after 60 "res://$scene" 2>&1 | tee run.log
            if grep -q "SCRIPT ERROR" run.log; then echo "Script error in $scene"; exit 1; fi
          done

      # Um teste GUT que não compila é ignorado em silêncio ("does not extend GutTest"):
      # qualquer SCRIPT ERROR ou Parse Error no log derruba o passo.
      - name: Unit tests (GUT)
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./godot --headless --path . -s addons/gut/gut_cmdln.gd 2>&1 | tee gut.log
          if grep -qE "SCRIPT ERROR|Parse Error" gut.log; then
            echo "::error::SCRIPT ERROR / Parse Error no log do GUT"
            grep -nE -A2 "SCRIPT ERROR|Parse Error" gut.log | head -40
            exit 1
          fi

      # Testes headless do Dev B (core/tests e ui/tests, "RESULT fails=N") e pares de rede local.
      - name: Headless tests (core/tests, ui/tests)
        run: bash tools/run_headless_tests.sh ./godot

  # Build do Windows (#101): só no main (push) ou à mão (workflow_dispatch), depois dos testes.
  # PR não exporta. Preset "Windows Desktop" em export_presets.cfg (x86_64, PCK embutido).
  # Runner Windows por causa do rcedit (ícone e metadados do .exe).
  export-windows:
    needs: tests
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GODOT_VERSION: "4.3"
      RCEDIT_VERSION: "v2.0.0"
      RCEDIT_SHA256: "3e7801db1a5edbec91b49a24a094aad776cb4515488ea5a4ca2289c400eade2a"
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot ${{ env.GODOT_VERSION }} (win64)
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
          7z x -y -bso0 godot.zip
          # O wrapper de console acha o executável GUI pelo nome sem "_console".
          mv "Godot_v${GODOT_VERSION}-stable_win64.exe" godot.exe
          mv "Godot_v${GODOT_VERSION}-stable_win64_console.exe" godot_console.exe

      # Só os templates do Windows x86_64 (o .tpz inteiro tem ~1 GB).
      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Godot/export_templates/4.3.stable
          key: godot-export-templates-4.3-stable-windows-x86_64-win

      - name: Download export templates (cache miss)
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          T="$(cygpath -u "$APPDATA")/Godot/export_templates/4.3.stable"
          mkdir -p "$T"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          7z e -y -bso0 templates.tpz -o"$(cygpath -w "$T")" templates/version.txt             templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe             templates/windows_debug_x86_64.exe templates/windows_debug_x86_64_console.exe
          rm templates.tpz
          ls -la "$T"

      # rcedit (versão fixa, conferida por SHA-256) apontado no editor_settings do runner.
      - name: rcedit
        run: |
          curl -sSL -o rcedit-x64.exe "https://github.com/electron/rcedit/releases/download/${RCEDIT_VERSION}/rcedit-x64.exe"
          echo "${RCEDIT_SHA256}  rcedit-x64.exe" | sha256sum -c -
          RCEDIT="$(cygpath -m "$PWD/rcedit-x64.exe")"
          APPD="$(cygpath -u "$APPDATA")"
          mkdir -p "$APPD/Godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/windows/rcedit = \"$RCEDIT\""
          } > "$APPD/Godot/editor_settings-4.3.tres"
          cat "$APPD/Godot/editor_settings-4.3.tres"

      - name: Import project
        run: ./godot_console.exe --headless --path . --import

      # O plugin GUT (só do editor) reclama do próprio config no export: essa linha é ignorada.
      - name: Export Windows (release)
        run: |
          mkdir -p build/windows
          ./godot_console.exe --headless --path . --export-release "Windows Desktop" build/windows/ScanDig.exe 2>&1 | tee export.log
          if [ ! -f build/windows/ScanDig.exe ]; then
            echo "::error::build/windows/ScanDig.exe não foi gerado"
            exit 1
          fi
          if grep -E "SCRIPT ERROR|ERROR: " export.log | grep -v "gut_editor_config.json"; then
            echo "::error::erro no export (ver acima)"
            exit 1
          fi
          ls -la build/windows

      # O rcedit gravou ícone e metadados? (sem ele o .exe sai com os da Godot)
      - name: Check exe metadata
        shell: pwsh
        run: |
          $vi = (Get-Item build/windows/ScanDig.exe).VersionInfo
          $vi | Format-List FileVersion, ProductVersion, CompanyName, ProductName, FileDescription
          if ($vi.CompanyName -ne "ScanDig Team" -or $vi.FileVersion -ne "0.1.0.0") { Write-Error "metadados do .exe não aplicados"; exit 1 }

      - name: Zip
        run: |
          cd build/windows
          7z a -tzip -mx=9 -bso0 ../../ScanDig-windows.zip ScanDig.exe
          cd ../..
          ls -la ScanDig-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ScanDig-windows
          path: ScanDig-windows.zip
          retention-days: 14
          if-no-files-found: error
