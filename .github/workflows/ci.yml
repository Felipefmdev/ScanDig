name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Os passos ficam em tests.yml (reutilizado pelo release.yml, #144).
  tests:
    uses: ./.github/workflows/tests.yml

  # Build do Windows (#101): só no main (push) ou à mão (workflow_dispatch), depois dos testes.
  # PR não exporta. Os passos ficam em build-windows.yml (reutilizado pelo release.yml, #138).
  export-windows:
    needs: tests
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-windows.yml
